<!-- =====================================================================
     beamsentry.com  →  kinemarc.com/beamsentry/

     Decided 2026-09-01 (Thue): one site, one design system. The full
     BeamSentry product page moved into the company site so the product
     and the company can no longer drift apart. This repo stays alive as
     the holder of the beamsentry.com domain and forwards to it.

     The previous standalone product page (built 2026-08-25) is not lost —
     it is in this repo's git history at commit 0f7b6a6.

     TO CHANGE THE DESTINATION: edit the URL in the THREE places marked
     TARGET below, commit, push.

     Deliberately NOT an HTTP 301: browsers cache a 301 permanently, so
     anyone who landed here once would keep being sent to the old
     destination forever, even after this file changed.

     NOTE: beamsentry.com has never been delegated — no nameservers are
     registered at Verisign, so nothing here is reachable yet. See
     BLACKGUARD_OVERVIEW.md §12.
     ===================================================================== -->
